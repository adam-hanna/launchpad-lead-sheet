name: Bug
description: Something behaves differently from docs/plan.md or from what the user expects.
labels: ['type:bug']
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed vs expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the sheet (JSON or text chart) and settings if relevant.
    validations:
      required: true
  - type: input
    id: contract
    attributes:
      label: Plan contract
      description: The § in docs/plan.md this violates, if any.
      placeholder: §4.1
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: macOS, browser, Live and Launchpad firmware versions; hardware or virtual Launchpad.
