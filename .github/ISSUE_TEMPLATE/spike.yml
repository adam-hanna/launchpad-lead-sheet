name: Spike
description: A time-boxed investigation that ends in a recorded result, not shipped code.
labels: ['type:spike']
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method and pass criteria
      description: What is measured, how, and what counts as pass/fail. See docs/plan.md §5 for the gate format.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: 1 day
  - type: textarea
    id: result
    attributes:
      label: Result (fill in when done)
      description: Link the evidence under docs/spikes/ and state the consequence for the plan.
